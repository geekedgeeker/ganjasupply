<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="GanjaSupply - Premium Supply Management">
  <title>Audit Logs - GanjaSupply</title>
  <link rel="stylesheet" href="../assets/css/design-system.css">
  <link rel="stylesheet" href="../assets/css/modern-layout.css">
  <link rel="stylesheet" href="../assets/css/modern-components.css">
</head>
<body>
  <div class="app">
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <img src="../assets/weedlogo.gif" alt="GanjaSupply" class="sidebar-logo-image">
          <span class="sidebar-logo-text">GanjaSupply</span>
        </div>
        <span class="sidebar-subtitle">Supply Management</span>
      </div>
      
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-link">
          <div class="nav-link-icon">📊</div>
          <span>Dashboard</span>
        </a>
        <a href="inventory.html" class="nav-link">
          <div class="nav-link-icon">📦</div>
          <span>Inventory</span>
        </a>
        <a href="orders.html" class="nav-link">
          <div class="nav-link-icon">🛒</div>
          <span>Orders</span>
        </a>
        <a href="suppliers.html" class="nav-link">
          <div class="nav-link-icon">🤝</div>
          <span>Suppliers</span>
        </a>
        <a href="users.html" class="nav-link">
          <div class="nav-link-icon">👥</div>
          <span>Users</span>
        </a>
        <a href="settings.html" class="nav-link">
          <div class="nav-link-icon">⚙️</div>
          <span>Settings</span>
        </a>
        <a href="audit-logs.html" class="nav-link active">
          <div class="nav-link-icon">📋</div>
          <span>Audit Logs</span>
        </a>
      </nav>
      
      <div class="sidebar-footer">
        <div class="flex items-center gap-3 p-3">
          <div class="w-10 h-10 rounded-full bg-gradient-to-br from-green-400 to-green-600 flex items-center justify-center text-white font-bold" id="userAvatar">G</div>
          <div class="flex-1">
            <div class="text-sm font-semibold text-primary" id="userName">Loading...</div>
            <div class="text-xs text-tertiary" id="userRole">Loading...</div>
          </div>
        </div>
        <button class="nav-link" id="logoutBtn">
          <div class="nav-link-icon">🚪</div>
          <span>Sign Out</span>
        </button>
      </div>
    </aside>
    
    <main class="main">
      <header class="header">
        <div class="header-left">
          <button class="mobile-menu-btn" id="mobileMenuBtn">
            <span></span>
            <span></span>
            <span></span>
          </button>
          <div>
            <h1 class="page-title">Audit Logs</h1>
            <p class="page-subtitle">Track all system events and changes</p>
          </div>
        </div>
        <div class="header-right">
          <div class="text-sm text-secondary font-mono" id="currentTime"></div>
          <button class="btn btn-secondary" id="exportBtn">Export Logs</button>
        </div>
      </header>
      
      <div class="content">
        <div class="content-panel">
          <div class="panel-header">
            <h2 class="panel-title">System Activity</h2>
            <div class="panel-actions">
              <select class="input select" id="eventTypeFilter" style="width: 150px;">
                <option value="">All Events</option>
                <option value="product_created">Product Created</option>
                <option value="product_updated">Product Updated</option>
                <option value="product_deleted">Product Deleted</option>
                <option value="order_created">Order Created</option>
                <option value="order_updated">Order Updated</option>
                <option value="order_deleted">Order Deleted</option>
                <option value="supplier_created">Supplier Created</option>
                <option value="supplier_updated">Supplier Updated</option>
                <option value="supplier_deleted">Supplier Deleted</option>
                <option value="authentication">Authentication</option>
                <option value="schema_migration">Schema Migration</option>
              </select>
              <input type="text" class="input" placeholder="Search logs..." id="searchInput" style="width: 200px;">
            </div>
          </div>
          <div class="panel-body">
            <div class="table-container">
              <table class="table">
                <thead>
                  <tr>
                    <th>Timestamp</th>
                    <th>Event Type</th>
                    <th>User</th>
                    <th>Details</th>
                    <th>IP Address</th>
                  </tr>
                </thead>
                <tbody id="auditLogsBody">
                  <tr>
                    <td colspan="5" class="text-center text-tertiary">Loading audit logs...</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
  
  <div class="toast-container" id="toastContainer"></div>
  
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/enhanced_data_manager.js"></script>
  <script>
    const userAvatar = document.getElementById('userAvatar');
    const userName = document.getElementById('userName');
    const userRole = document.getElementById('userRole');
    const logoutBtn = document.getElementById('logoutBtn');
    const toastContainer = document.getElementById('toastContainer');
    const auditLogsBody = document.getElementById('auditLogsBody');
    const eventTypeFilter = document.getElementById('eventTypeFilter');
    const searchInput = document.getElementById('searchInput');
    const exportBtn = document.getElementById('exportBtn');
    const mobileMenuBtn = document.getElementById('mobileMenuBtn');
    const sidebar = document.getElementById('sidebar');
    const sidebarOverlay = document.getElementById('sidebarOverlay');
    
    function toggle_sidebar() {
      sidebar.classList.toggle('active');
      sidebarOverlay.classList.toggle('active');
      mobileMenuBtn.classList.toggle('active');
    }
    
    mobileMenuBtn.addEventListener('click', toggle_sidebar);
    sidebarOverlay.addEventListener('click', toggle_sidebar);
    
    function showToast(message, type = 'success') {
      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;
      
      const icon = type === 'success' ? '✓' : type === 'error' ? '✕' : '⚠';
      
      toast.innerHTML = `
        <div class="toast-icon">${icon}</div>
        <div class="toast-content">
          <div class="toast-title">${type.charAt(0).toUpperCase() + type.slice(1)}</div>
          <div class="toast-message">${message}</div>
        </div>
        <button class="toast-close">✕</button>
      `;
      
      toastContainer.appendChild(toast);
      
      setTimeout(() => toast.classList.add('show'), 10);
      
      const closeBtn = toast.querySelector('.toast-close');
      closeBtn.addEventListener('click', () => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 300);
      });
      
      setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 300);
      }, 5000);
    }
    
    function format_timestamp(timestamp) {
      const date = new Date(timestamp);
      return date.toLocaleString();
    }
    
    function format_event_type(event_type) {
      return event_type.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
    }
    
    function format_details(details) {
      if (!details) return '-';
      
      const formatted = Object.entries(details)
        .map(([key, value]) => {
          const formatted_key = key.replace(/_/g, ' ');
          const formatted_value = typeof value === 'object' ? JSON.stringify(value) : value;
          return `${formatted_key}: ${formatted_value}`;
        })
        .join('<br>');
      
      return `<div class="text-xs">${formatted}</div>`;
    }
    
    function get_event_badge(event_type) {
      const badge_colors = {
        'product_created': 'badge-success',
        'product_updated': 'badge-info',
        'product_deleted': 'badge-danger',
        'order_created': 'badge-success',
        'order_updated': 'badge-info',
        'order_deleted': 'badge-danger',
        'supplier_created': 'badge-success',
        'supplier_updated': 'badge-info',
        'supplier_deleted': 'badge-danger',
        'authentication': 'badge-warning',
        'schema_migration': 'badge-secondary'
      };
      
      return badge_colors[event_type] || 'badge-secondary';
    }
    
    function load_audit_logs() {
      try {
        const filters = {};
        
        if (eventTypeFilter.value) {
          filters.event_type = eventTypeFilter.value;
        }
        
        const logs = enhanced_data_manager_instance.get_audit_logs(filters);
        
        if (searchInput.value) {
          const search = searchInput.value.toLowerCase();
          return logs.filter(log => 
            log.event_type.toLowerCase().includes(search) ||
            log.user?.username?.toLowerCase().includes(search) ||
            JSON.stringify(log.details).toLowerCase().includes(search)
          );
        }
        
        if (logs.length === 0) {
          auditLogsBody.innerHTML = '<tr><td colspan="5" class="text-center text-tertiary">No audit logs found</td></tr>';
          return;
        }
        
        auditLogsBody.innerHTML = logs.map(log => `
          <tr>
            <td>${format_timestamp(log.timestamp)}</td>
            <td><span class="badge ${get_event_badge(log.event_type)}">${format_event_type(log.event_type)}</span></td>
            <td>${log.user?.username || 'System'}</td>
            <td>${format_details(log.details)}</td>
            <td>${log.ip_address}</td>
          </tr>
        `).join('');
      } catch (error) {
        showToast('Failed to load audit logs', 'error');
        console.error('Error loading audit logs:', error);
      }
    }
    
    function export_logs() {
      try {
        const logs = enhanced_data_manager_instance.get_audit_logs();
        const data = JSON.stringify(logs, null, 2);
        const blob = new Blob([data], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `audit_logs_${new Date().toISOString().split('T')[0]}.json`;
        a.click();
        URL.revokeObjectURL(url);
        showToast('Audit logs exported successfully', 'success');
      } catch (error) {
        showToast('Failed to export audit logs', 'error');
        console.error('Error exporting logs:', error);
      }
    }
    
    function update_current_time() {
      const now = new Date();
      const time_string = now.toLocaleString();
      document.getElementById('currentTime').textContent = time_string;
    }
    
    setInterval(update_current_time, 1000);
    update_current_time();
    
    eventTypeFilter.addEventListener('change', load_audit_logs);
    searchInput.addEventListener('input', load_audit_logs);
    exportBtn.addEventListener('click', export_logs);
    
    async function load_user_info() {
      try {
        await auth.init();
        
        if (!auth.is_authenticated()) {
          window.location.href = 'sign-in.html';
          return;
        }
        
        const user = auth.get_current_user();
        userName.textContent = user.username;
        userRole.textContent = user.role;
        userAvatar.textContent = user.username.charAt(0).toUpperCase();
        
        await load_audit_logs();
      } catch (error) {
        showToast('Failed to load user information', 'error');
        console.error('Error loading user info:', error);
      }
    }
    
    logoutBtn.addEventListener('click', () => {
      auth.logout();
    });
    
    load_user_info();
  </script>
</body>
</html>
