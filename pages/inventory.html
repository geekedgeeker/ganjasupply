<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="GanjaSupply - Premium Supply Management">
  <title>Inventory - GanjaSupply</title>
  <link rel="stylesheet" href="../assets/css/main.css">
</head>
<body>
  <div class="app-container">
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo-container">
          <img src="../assets/weedlogo.gif" alt="GanjaSupply" class="logo-image">
          <div class="logo">GanjaSupply</div>
        </div>
        <div class="logo-subtitle">Supply Management</div>
      </div>
      
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-link">
          <span>Dashboard</span>
        </a>
        <a href="inventory.html" class="nav-link active">
          <span>Inventory</span>
        </a>
        <a href="orders.html" class="nav-link">
          <span>Orders</span>
        </a>
        <a href="suppliers.html" class="nav-link">
          <span>Suppliers</span>
        </a>
        <a href="users.html" class="nav-link">
          <span>Users</span>
        </a>
        <a href="settings.html" class="nav-link">
          <span>Settings</span>
        </a>
      </nav>
      
      <div class="sidebar-footer">
        <div class="user-profile">
          <div class="user-avatar" id="userAvatar">G</div>
          <div class="user-info">
            <div class="user-name" id="userName">Loading...</div>
            <div class="user-role" id="userRole">Loading...</div>
          </div>
        </div>
        <button class="nav-link" id="logoutBtn" style="margin-top: 1rem; width: 100%;">
          <span>Sign Out</span>
        </button>
      </div>
    </aside>
    
    <main class="main-content">
      <header class="header">
        <div style="display: flex; align-items: center; gap: var(--spacing-md);">
          <button class="mobile-menu-btn" id="mobileMenuBtn">
            <span></span>
            <span></span>
            <span></span>
          </button>
          <div>
            <h1 class="page-title">Inventory</h1>
            <p class="page-subtitle">Manage your product inventory</p>
          </div>
        </div>
        <div class="header-actions">
          <div class="current-time" id="currentTime"></div>
          <button class="btn-primary" id="addProductBtn">Add Product</button>
        </div>
      </header>
      
      <div class="glass-panel" style="padding: 2rem;">
        <div class="table-container">
          <table class="data-table" id="inventoryTable">
            <thead>
              <tr>
                <th>Product Name</th>
                <th>Type</th>
                <th>Rating</th>
                <th>Quantities Available</th>
                <th>Total Grams</th>
                <th>Comments</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="inventoryBody">
              <tr>
                <td colspan="7" style="text-align: center; color: var(--text-muted);">No products in inventory</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
  
  <div class="modal-overlay" id="addProductModal">
    <div class="modal-content">
      <h2 style="font-family: var(--font-display); font-size: 1.5rem; margin-bottom: 1.5rem; color: var(--text-primary);">Add New Product</h2>
      
      <form id="addProductForm" style="display: flex; flex-direction: column; gap: 1.5rem;">
        <div class="form-group">
          <label class="form-label" for="productName">Product Name</label>
          <input type="text" id="productName" class="input-field" placeholder="Enter product name" required>
        </div>
        
        <div class="form-group">
          <label class="form-label" for="productType">Type</label>
          <select id="productType" class="input-field" required>
            <option value="">Select type</option>
            <option value="indica">Indica</option>
            <option value="sativa">Sativa</option>
            <option value="hybrid">Hybrid</option>
          </select>
        </div>
        
        <div class="form-group">
          <label class="form-label">Quality Rating</label>
          <div class="star-rating" id="starRating">
            <span class="star star-empty" data-rating="1">★</span>
            <span class="star star-empty" data-rating="2">★</span>
            <span class="star star-empty" data-rating="3">★</span>
            <span class="star star-empty" data-rating="4">★</span>
            <span class="star star-empty" data-rating="5">★</span>
          </div>
          <input type="hidden" id="ratingValue" value="0">
        </div>
        
        <div class="form-group">
          <label class="form-label">Quantities Available</label>
          <div class="quantity-checkbox-group">
            <div class="quantity-option">
              <input type="checkbox" class="quantity-checkbox" data-quantity="1g" id="qty1g">
              <label for="qty1g" class="quantity-label">1g</label>
              <input type="number" class="quantity-price" data-quantity="1g" placeholder="Price" style="width: 80px;">
            </div>
            <div class="quantity-option">
              <input type="checkbox" class="quantity-checkbox" data-quantity="3.5g" id="qty35g">
              <label for="qty35g" class="quantity-label">3.5g</label>
              <input type="number" class="quantity-price" data-quantity="3.5g" placeholder="Price" style="width: 80px;">
            </div>
            <div class="quantity-option">
              <input type="checkbox" class="quantity-checkbox" data-quantity="7g" id="qty7g">
              <label for="qty7g" class="quantity-label">7g</label>
              <input type="number" class="quantity-price" data-quantity="7g" placeholder="Price" style="width: 80px;">
            </div>
            <div class="quantity-option">
              <input type="checkbox" class="quantity-checkbox" data-quantity="14g" id="qty14g">
              <label for="qty14g" class="quantity-label">14g</label>
              <input type="number" class="quantity-price" data-quantity="14g" placeholder="Price" style="width: 80px;">
            </div>
            <div class="quantity-option">
              <input type="checkbox" class="quantity-checkbox" data-quantity="28g" id="qty28g">
              <label for="qty28g" class="quantity-label">28g</label>
              <input type="number" class="quantity-price" data-quantity="28g" placeholder="Price" style="width: 80px;">
            </div>
            <div class="quantity-option">
              <input type="checkbox" class="quantity-checkbox" data-quantity="custom" id="qtyCustom">
              <label for="qtyCustom" class="quantity-label">Custom</label>
              <input type="number" class="quantity-price" data-quantity="custom" placeholder="Price" style="width: 80px;">
              <input type="text" id="customQuantity" placeholder="Custom amount" style="width: 100px; margin-left: 0.5rem;">
            </div>
          </div>
        </div>
        
        <div class="form-group">
          <label class="form-label" for="totalGrams">Total Grams Available</label>
          <input type="number" id="totalGrams" class="input-field" placeholder="Enter total grams" required>
        </div>
        
        <div class="form-group">
          <label class="form-label" for="comments">Comments</label>
          <textarea id="comments" class="input-field" rows="3" placeholder="Add any notes about this product"></textarea>
        </div>
        
        <div class="form-actions">
          <button type="button" class="btn-secondary" id="cancelBtn">Cancel</button>
          <button type="submit" class="btn-primary">Add Product</button>
        </div>
      </form>
    </div>
  </div>
  
  <div class="toast" id="toast"></div>
  
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/data_manager.js"></script>
  <script>
    const userAvatar = document.getElementById('userAvatar');
    const userName = document.getElementById('userName');
    const userRole = document.getElementById('userRole');
    const logoutBtn = document.getElementById('logoutBtn');
    const toast = document.getElementById('toast');
    const addProductBtn = document.getElementById('addProductBtn');
    const addProductModal = document.getElementById('addProductModal');
    const cancelBtn = document.getElementById('cancelBtn');
    const addProductForm = document.getElementById('addProductForm');
    const inventoryBody = document.getElementById('inventoryBody');
    const starRating = document.getElementById('starRating');
    const ratingValue = document.getElementById('ratingValue');
    const mobileMenuBtn = document.getElementById('mobileMenuBtn');
    const sidebar = document.getElementById('sidebar');
    const sidebarOverlay = document.getElementById('sidebarOverlay');
    
    let selected_rating = 0;
    
    function toggle_sidebar() {
      sidebar.classList.toggle('open');
      sidebarOverlay.classList.toggle('active');
      mobileMenuBtn.classList.toggle('active');
    }
    
    mobileMenuBtn.addEventListener('click', toggle_sidebar);
    sidebarOverlay.addEventListener('click', toggle_sidebar);
    
    function show_toast(message, type = 'success') {
      toast.textContent = message;
      toast.className = `toast toast-${type} active`;
      
      setTimeout(() => {
        toast.classList.remove('active');
      }, 3000);
    }
    
    function format_date(date_string) {
      const date = new Date(date_string);
      return date.toLocaleString();
    }
    
    function update_current_time() {
      const now = new Date();
      const time_string = now.toLocaleString();
      document.getElementById('currentTime').textContent = time_string;
    }
    
    setInterval(update_current_time, 1000);
    update_current_time();
    
    function get_star_class(rating) {
      return `star-${rating}`;
    }
    
    function render_star_rating(rating) {
      let stars_html = '';
      for (let i = 1; i <= 5; i++) {
        if (i <= rating) {
          stars_html += `<span class="star ${get_star_class(i)}">★</span>`;
        } else {
          stars_html += `<span class="star star-empty">★</span>`;
        }
      }
      return stars_html;
    }
    
    function render_quantities(quantities) {
      if (!quantities || Object.keys(quantities).length === 0) {
        return '<span style="color: var(--text-muted);">No quantities set</span>';
      }
      
      return Object.entries(quantities).map(([qty, price]) => {
        return `<span style="margin-right: 0.5rem; padding: 0.25rem 0.5rem; background: var(--smoke-light); border-radius: 0.25rem;">${qty}: $${price}</span>`;
      }).join('');
    }
    
    async function load_inventory() {
      await data_manager_instance.init();
      const products = data_manager_instance.get_products();
      
      if (products.length === 0) {
        inventoryBody.innerHTML = '<tr><td colspan="7" style="text-align: center; color: var(--text-muted);">No products in inventory</td></tr>';
        return;
      }
      
      inventoryBody.innerHTML = products.map(product => `
        <tr>
          <td>${product.name}</td>
          <td><span class="badge badge-${product.type}">${product.type.charAt(0).toUpperCase() + product.type.slice(1)}</span></td>
          <td>${render_star_rating(product.rating)}</td>
          <td>${render_quantities(product.quantities)}</td>
          <td>${product.total_grams}g</td>
          <td>${product.comments || '-'}</td>
          <td>
            <button class="btn-secondary" onclick="delete_product('${product.id}')" style="padding: 0.25rem 0.75rem; font-size: 0.75rem;">Delete</button>
          </td>
        </tr>
      `).join('');
    }
    
    async function delete_product(product_id) {
      if (confirm('Are you sure you want to delete this product?')) {
        data_manager_instance.delete_product(product_id);
        show_toast('Product deleted successfully');
        await load_inventory();
      }
    }
    
    function handle_star_click(rating) {
      selected_rating = rating;
      ratingValue.value = rating;
      
      const stars = starRating.querySelectorAll('.star');
      stars.forEach((star, index) => {
        star.classList.remove('star-empty', 'star-1', 'star-2', 'star-3', 'star-4', 'star-5');
        if (index < rating) {
          star.classList.add(`star-${index + 1}`);
        } else {
          star.classList.add('star-empty');
        }
      });
    }
    
    function get_selected_quantities() {
      const quantities = {};
      const checkboxes = document.querySelectorAll('.quantity-checkbox:checked');
      
      checkboxes.forEach(checkbox => {
        const qty = checkbox.dataset.quantity;
        const price_input = document.querySelector(`.quantity-price[data-quantity="${qty}"]`);
        const price = price_input ? parseFloat(price_input.value) || 0 : 0;
        
        if (qty === 'custom') {
          const custom_qty = document.getElementById('customQuantity').value;
          if (custom_qty && price > 0) {
            quantities[custom_qty] = price;
          }
        } else if (price > 0) {
          quantities[qty] = price;
        }
      });
      
      return quantities;
    }
    
    starRating.querySelectorAll('.star').forEach(star => {
      star.addEventListener('click', () => {
        const rating = parseInt(star.dataset.rating);
        handle_star_click(rating);
      });
    });
    
    addProductBtn.addEventListener('click', () => {
      addProductModal.classList.add('active');
    });
    
    cancelBtn.addEventListener('click', () => {
      addProductModal.classList.remove('active');
      addProductForm.reset();
      selected_rating = 0;
      starRating.querySelectorAll('.star').forEach(star => {
        star.classList.remove('star-1', 'star-2', 'star-3', 'star-4', 'star-5');
        star.classList.add('star-empty');
      });
    });
    
    addProductForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const product = {
        name: document.getElementById('productName').value,
        type: document.getElementById('productType').value,
        rating: selected_rating,
        quantities: get_selected_quantities(),
        total_grams: parseFloat(document.getElementById('totalGrams').value),
        comments: document.getElementById('comments').value
      };
      
      if (product.rating === 0) {
        show_toast('Please select a quality rating', 'error');
        return;
      }
      
      if (Object.keys(product.quantities).length === 0) {
        show_toast('Please select at least one quantity', 'error');
        return;
      }
      
      data_manager_instance.add_product(product);
      show_toast('Product added successfully');
      
      addProductModal.classList.remove('active');
      addProductForm.reset();
      selected_rating = 0;
      starRating.querySelectorAll('.star').forEach(star => {
        star.classList.remove('star-1', 'star-2', 'star-3', 'star-4', 'star-5');
        star.classList.add('star-empty');
      });
      
      await load_inventory();
    });
    
    async function load_user_info() {
      await auth.init();
      
      if (!auth.is_authenticated()) {
        window.location.href = 'sign-in.html';
        return;
      }
      
      const user = auth.get_current_user();
      userName.textContent = user.username;
      userRole.textContent = user.role;
      userAvatar.textContent = user.username.charAt(0).toUpperCase();
      
      await load_inventory();
    }
    
    logoutBtn.addEventListener('click', () => {
      auth.logout();
    });
    
    load_user_info();
  </script>
</body>
</html>
