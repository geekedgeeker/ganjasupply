<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="GanjaSupply - Premium Supply Management">
  <title>Inventory - GanjaSupply</title>
  <link rel="stylesheet" href="../assets/css/design-system.css">
  <link rel="stylesheet" href="../assets/css/modern-layout.css">
  <link rel="stylesheet" href="../assets/css/modern-components.css">
  <link rel="stylesheet" href="../assets/css/star-rating.css">
</head>
<body>
  <div class="app">
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <img src="../assets/weedlogo.gif" alt="GanjaSupply" class="sidebar-logo-image">
          <span class="sidebar-logo-text">GanjaSupply</span>
        </div>
        <span class="sidebar-subtitle">Supply Management</span>
      </div>
      
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-link">
          <div class="nav-link-icon">📊</div>
          <span>Dashboard</span>
        </a>
        <a href="inventory.html" class="nav-link active">
          <div class="nav-link-icon">📦</div>
          <span>Inventory</span>
        </a>
        <a href="orders.html" class="nav-link">
          <div class="nav-link-icon">🛒</div>
          <span>Orders</span>
        </a>
        <a href="suppliers.html" class="nav-link">
          <div class="nav-link-icon">🤝</div>
          <span>Suppliers</span>
        </a>
        <a href="users.html" class="nav-link">
          <div class="nav-link-icon">👥</div>
          <span>Users</span>
        </a>
        <a href="settings.html" class="nav-link">
          <div class="nav-link-icon">⚙️</div>
          <span>Settings</span>
        </a>
      </nav>
      
      <div class="sidebar-footer">
        <div class="flex items-center gap-3 p-3">
          <div class="w-10 h-10 rounded-full bg-gradient-to-br from-green-400 to-green-600 flex items-center justify-center text-white font-bold" id="userAvatar">G</div>
          <div class="flex-1">
            <div class="text-sm font-semibold text-primary" id="userName">Loading...</div>
            <div class="text-xs text-tertiary" id="userRole">Loading...</div>
          </div>
        </div>
        <button class="nav-link" id="logoutBtn">
          <div class="nav-link-icon">🚪</div>
          <span>Sign Out</span>
        </button>
      </div>
    </aside>
    
    <main class="main">
      <header class="header">
        <div class="header-left">
          <button class="mobile-menu-btn" id="mobileMenuBtn">
            <span></span>
            <span></span>
            <span></span>
          </button>
          <div>
            <h1 class="page-title">Inventory</h1>
            <p class="page-subtitle">Manage your product inventory</p>
          </div>
        </div>
        <div class="header-right">
          <div class="text-sm text-secondary font-mono" id="currentTime"></div>
          <button class="btn btn-primary" id="addProductBtn">Add Product</button>
        </div>
      </header>
      
      <div class="content">
        <div class="content-panel">
          <div class="panel-header">
            <h2 class="panel-title">Product Inventory</h2>
            <div class="panel-actions">
              <input type="text" class="input" placeholder="Search products..." id="searchInput" style="width: 250px;">
            </div>
          </div>
          <div class="panel-body">
            <div class="table-container">
              <table class="table">
                <thead>
                  <tr>
                    <th>Product Name</th>
                    <th>Type</th>
                    <th>Rating</th>
                    <th>Quantities</th>
                    <th>Total Grams</th>
                    <th>Comments</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="inventoryBody">
                  <tr>
                    <td colspan="7" class="text-center text-tertiary">No products in inventory</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
  
  <div class="modal modal-md" id="addProductModal">
    <div class="modal-backdrop" id="modalBackdrop"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title">Add New Product</h3>
        <button class="modal-close" id="cancelBtn">✕</button>
      </div>
      <div class="modal-body">
        <form id="addProductForm">
          <div class="form-group" style="margin-bottom: var(--space-4);">
            <label class="form-label">Product Name</label>
            <input type="text" class="input" name="name" required>
          </div>
          
          <div class="form-group" style="margin-bottom: var(--space-4);">
            <label class="form-label">Type</label>
            <select class="input select" name="type" required>
              <option value="">Select type...</option>
              <option value="Indica">Indica</option>
              <option value="Sativa">Sativa</option>
              <option value="Hybrid">Hybrid</option>
            </select>
          </div>
          
          <div class="form-group" style="margin-bottom: var(--space-4);">
            <label class="form-label">Rating</label>
            <div class="star-rating" id="starRating">
              <span class="star star-empty" data-rating="1">★</span>
              <span class="star star-empty" data-rating="2">★</span>
              <span class="star star-empty" data-rating="3">★</span>
              <span class="star star-empty" data-rating="4">★</span>
              <span class="star star-empty" data-rating="5">★</span>
            </div>
            <input type="hidden" name="rating" id="ratingValue" value="0">
          </div>
          
          <div class="form-group" style="margin-bottom: var(--space-4);">
            <label class="form-label">Total Grams Available</label>
            <input type="number" class="input" name="total_grams" min="0" step="0.1" required>
          </div>
          
          <div class="form-group" style="margin-bottom: var(--space-4);">
            <label class="form-label">Comments</label>
            <textarea class="input textarea" name="comments" rows="3"></textarea>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="cancelBtn2">Cancel</button>
        <button class="btn btn-primary" id="saveProductBtn">Add Product</button>
      </div>
    </div>
  </div>
  
  <div class="toast-container" id="toastContainer"></div>
  
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/enhanced_data_manager.js"></script>
  <script>
    const userAvatar = document.getElementById('userAvatar');
    const userName = document.getElementById('userName');
    const userRole = document.getElementById('userRole');
    const logoutBtn = document.getElementById('logoutBtn');
    const toastContainer = document.getElementById('toastContainer');
    const addProductBtn = document.getElementById('addProductBtn');
    const addProductModal = document.getElementById('addProductModal');
    const modalBackdrop = document.getElementById('modalBackdrop');
    const cancelBtn = document.getElementById('cancelBtn');
    const cancelBtn2 = document.getElementById('cancelBtn2');
    const saveProductBtn = document.getElementById('saveProductBtn');
    const addProductForm = document.getElementById('addProductForm');
    const inventoryBody = document.getElementById('inventoryBody');
    const starRating = document.getElementById('starRating');
    const ratingValue = document.getElementById('ratingValue');
    const mobileMenuBtn = document.getElementById('mobileMenuBtn');
    const sidebar = document.getElementById('sidebar');
    const sidebarOverlay = document.getElementById('sidebarOverlay');
    
    let selected_rating = 0;
    
    function toggle_sidebar() {
      sidebar.classList.toggle('active');
      sidebarOverlay.classList.toggle('active');
      mobileMenuBtn.classList.toggle('active');
    }
    
    mobileMenuBtn.addEventListener('click', toggle_sidebar);
    sidebarOverlay.addEventListener('click', toggle_sidebar);
    
    function showToast(message, type = 'success') {
      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;
      
      const icon = type === 'success' ? '✓' : type === 'error' ? '✕' : '⚠';
      
      toast.innerHTML = `
        <div class="toast-icon">${icon}</div>
        <div class="toast-content">
          <div class="toast-title">${type.charAt(0).toUpperCase() + type.slice(1)}</div>
          <div class="toast-message">${message}</div>
        </div>
        <button class="toast-close">✕</button>
      `;
      
      toastContainer.appendChild(toast);
      
      setTimeout(() => toast.classList.add('show'), 10);
      
      const closeBtn = toast.querySelector('.toast-close');
      closeBtn.addEventListener('click', () => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 300);
      });
      
      setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 300);
      }, 5000);
    }
    
    function format_date(date_string) {
      const date = new Date(date_string);
      return date.toLocaleString();
    }
    
    function update_current_time() {
      const now = new Date();
      const time_string = now.toLocaleString();
      document.getElementById('currentTime').textContent = time_string;
    }
    
    setInterval(update_current_time, 1000);
    update_current_time();
    
    function render_star_rating(rating) {
      let stars_html = '';
      for (let i = 1; i <= 5; i++) {
        if (i <= rating) {
          stars_html += `<span class="star star-${i}">★</span>`;
        } else {
          stars_html += `<span class="star star-empty">★</span>`;
        }
      }
      return stars_html;
    }
    
    async function load_inventory() {
      try {
        const products = enhanced_data_manager_instance.get_products();
        
        if (products.length === 0) {
          inventoryBody.innerHTML = '<tr><td colspan="7" class="text-center text-tertiary">No products in inventory</td></tr>';
          return;
        }
        
        inventoryBody.innerHTML = products.map(product => `
          <tr>
            <td>${product.name}</td>
            <td><span class="badge badge-${product.type.toLowerCase()}">${product.type}</span></td>
            <td>${render_star_rating(product.rating)}</td>
            <td>${product.quantities ? Object.keys(product.quantities).length : 0} options</td>
            <td>${product.total_grams}g</td>
            <td>${product.comments || '-'}</td>
            <td>
              <button class="btn btn-danger btn-sm" onclick="delete_product('${product.id}')">Delete</button>
            </td>
          </tr>
        `).join('');
      } catch (error) {
        showToast('Failed to load inventory', 'error');
        console.error('Error loading inventory:', error);
      }
    }
    
    async function delete_product(product_id) {
      if (confirm('Are you sure you want to delete this product?')) {
        const result = enhanced_data_manager_instance.delete_product(product_id);
        if (result.success) {
          showToast('Product deleted successfully', 'success');
          await load_inventory();
        } else {
          showToast(result.error, 'error');
        }
      }
    }
    
    function handle_star_click(rating) {
      selected_rating = rating;
      ratingValue.value = rating;
      
      const stars = starRating.querySelectorAll('.star');
      stars.forEach((star, index) => {
        star.classList.remove('star-empty', 'star-1', 'star-2', 'star-3', 'star-4', 'star-5');
        if (index < rating) {
          star.classList.add(`star-${index + 1}`);
        } else {
          star.classList.add('star-empty');
        }
      });
    }
    
    starRating.querySelectorAll('.star').forEach(star => {
      star.addEventListener('click', () => {
        const rating = parseInt(star.dataset.rating);
        handle_star_click(rating);
      });
    });
    
    function open_modal() {
      addProductModal.classList.add('active');
    }
    
    function close_modal() {
      addProductModal.classList.remove('active');
      addProductForm.reset();
      selected_rating = 0;
      starRating.querySelectorAll('.star').forEach(star => {
        star.classList.remove('star-1', 'star-2', 'star-3', 'star-4', 'star-5');
        star.classList.add('star-empty');
      });
    }
    
    addProductBtn.addEventListener('click', open_modal);
    cancelBtn.addEventListener('click', close_modal);
    cancelBtn2.addEventListener('click', close_modal);
    modalBackdrop.addEventListener('click', close_modal);
    
    saveProductBtn.addEventListener('click', async () => {
      const formData = new FormData(addProductForm);
      const product_data = {
        name: formData.get('name'),
        type: formData.get('type'),
        rating: selected_rating,
        total_grams: parseFloat(formData.get('total_grams')),
        comments: formData.get('comments'),
        quantities: []
      };
      
      if (product_data.rating === 0) {
        showToast('Please select a quality rating', 'error');
        return;
      }
      
      const result = enhanced_data_manager_instance.add_product(product_data);
      
      if (result.success) {
        showToast('Product added successfully', 'success');
        close_modal();
        await load_inventory();
      } else {
        showToast(result.error, 'error');
      }
    });
    
    async function load_user_info() {
      try {
        await auth.init();
        
        if (!auth.is_authenticated()) {
          window.location.href = 'sign-in.html';
          return;
        }
        
        const user = auth.get_current_user();
        userName.textContent = user.username;
        userRole.textContent = user.role;
        userAvatar.textContent = user.username.charAt(0).toUpperCase();
        
        await load_inventory();
      } catch (error) {
        showToast('Failed to load user information', 'error');
        console.error('Error loading user info:', error);
      }
    }
    
    logoutBtn.addEventListener('click', () => {
      auth.logout();
    });
    
    load_user_info();
  </script>
</body>
</html>
