<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="GanjaSupply - Premium Supply Management">
  <title>Suppliers - GanjaSupply</title>
  <link rel="stylesheet" href="../assets/css/main.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo-container">
          <img src="../assets/weedlogo.gif" alt="GanjaSupply" class="logo-image">
          <div class="logo">GanjaSupply</div>
        </div>
        <div class="logo-subtitle">Supply Management</div>
      </div>
      
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-link">
          <span>Dashboard</span>
        </a>
        <a href="inventory.html" class="nav-link">
          <span>Inventory</span>
        </a>
        <a href="orders.html" class="nav-link">
          <span>Orders</span>
        </a>
        <a href="suppliers.html" class="nav-link active">
          <span>Suppliers</span>
        </a>
        <a href="users.html" class="nav-link">
          <span>Users</span>
        </a>
        <a href="settings.html" class="nav-link">
          <span>Settings</span>
        </a>
      </nav>
      
      <div class="sidebar-footer">
        <div class="user-profile">
          <div class="user-avatar" id="userAvatar">G</div>
          <div class="user-info">
            <div class="user-name" id="userName">Loading...</div>
            <div class="user-role" id="userRole">Loading...</div>
          </div>
        </div>
        <button class="nav-link" id="logoutBtn" style="margin-top: 1rem; width: 100%;">
          <span>Sign Out</span>
        </button>
      </div>
    </aside>
    
    <main class="main-content">
      <header class="header">
        <div>
          <h1 class="page-title">Suppliers</h1>
          <p class="page-subtitle">Manage supplier relationships and contacts</p>
        </div>
        <div class="header-actions">
          <div class="current-time" id="currentTime"></div>
          <button class="btn-primary" id="addSupplierBtn">Add Supplier</button>
        </div>
      </header>
      
      <div class="glass-panel" style="padding: 1.5rem; margin-bottom: 2rem;">
        <div style="display: flex; gap: 1rem; flex-wrap: wrap; align-items: center;">
          <input type="text" id="searchName" class="input-field" placeholder="Search by name" style="flex: 1; min-width: 200px;">
          <select id="filterType" class="input-field" style="min-width: 150px;">
            <option value="">All Types</option>
            <option value="local">Local</option>
            <option value="online">Online</option>
            <option value="connection">Connection</option>
          </select>
          <select id="filterRating" class="input-field" style="min-width: 150px;">
            <option value="">All Ratings</option>
            <option value="5">5 Stars</option>
            <option value="4">4+ Stars</option>
            <option value="3">3+ Stars</option>
            <option value="2">2+ Stars</option>
            <option value="1">1+ Stars</option>
          </select>
        </div>
      </div>
      
      <div class="glass-panel" style="padding: 2rem;">
        <div class="table-container">
          <table class="data-table" id="suppliersTable">
            <thead>
              <tr>
                <th>Name</th>
                <th>Type</th>
                <th>Quantities/Prices</th>
                <th>Product Rating</th>
                <th>Overall Rating</th>
                <th>Comments</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="suppliersBody">
              <tr>
                <td colspan="7" style="text-align: center; color: var(--text-muted);">No suppliers listed</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
  
  <div class="modal-overlay" id="addSupplierModal">
    <div class="modal-content">
      <h2 style="font-family: var(--font-display); font-size: 1.5rem; margin-bottom: 1.5rem; color: var(--text-primary);">Add Supplier</h2>
      
      <form id="addSupplierForm" style="display: flex; flex-direction: column; gap: 1.5rem;">
        <div class="form-group">
          <label class="form-label" for="supplierName">Name</label>
          <input type="text" id="supplierName" class="input-field" placeholder="Enter supplier name" required>
        </div>
        
        <div class="form-group">
          <label class="form-label" for="supplierType">Type</label>
          <select id="supplierType" class="input-field" required>
            <option value="">Select type</option>
            <option value="local">Local</option>
            <option value="online">Online</option>
            <option value="connection">Connection</option>
          </select>
        </div>
        
        <div class="form-group">
          <label class="form-label" for="quantitiesPrices">Quantities Available / Prices</label>
          <textarea id="quantitiesPrices" class="input-field" rows="3" placeholder="e.g., 1g: $10, 3.5g: $30, 7g: $55"></textarea>
        </div>
        
        <div class="form-group">
          <label class="form-label">Product Quality Rating</label>
          <div class="star-rating" id="productStarRating">
            <span class="star star-empty" data-rating="1">★</span>
            <span class="star star-empty" data-rating="2">★</span>
            <span class="star star-empty" data-rating="3">★</span>
            <span class="star star-empty" data-rating="4">★</span>
            <span class="star star-empty" data-rating="5">★</span>
          </div>
          <input type="hidden" id="productRatingValue" value="0">
        </div>
        
        <div class="form-group">
          <label class="form-label">Overall Rating</label>
          <div class="star-rating" id="overallStarRating">
            <span class="star star-empty" data-rating="1">★</span>
            <span class="star star-empty" data-rating="2">★</span>
            <span class="star star-empty" data-rating="3">★</span>
            <span class="star star-empty" data-rating="4">★</span>
            <span class="star star-empty" data-rating="5">★</span>
          </div>
          <input type="hidden" id="overallRatingValue" value="0">
        </div>
        
        <div class="form-group">
          <label class="form-label" for="comments">Comments</label>
          <textarea id="comments" class="input-field" rows="3" placeholder="Add any notes about this supplier"></textarea>
        </div>
        
        <div class="form-actions">
          <button type="button" class="btn-secondary" id="cancelSupplierBtn">Cancel</button>
          <button type="submit" class="btn-primary">Add Supplier</button>
        </div>
      </form>
    </div>
  </div>
  
  <div class="toast" id="toast"></div>
  
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/data_manager.js"></script>
  <script>
    const userAvatar = document.getElementById('userAvatar');
    const userName = document.getElementById('userName');
    const userRole = document.getElementById('userRole');
    const logoutBtn = document.getElementById('logoutBtn');
    const toast = document.getElementById('toast');
    const addSupplierBtn = document.getElementById('addSupplierBtn');
    const addSupplierModal = document.getElementById('addSupplierModal');
    const cancelSupplierBtn = document.getElementById('cancelSupplierBtn');
    const addSupplierForm = document.getElementById('addSupplierForm');
    const suppliersBody = document.getElementById('suppliersBody');
    const productStarRating = document.getElementById('productStarRating');
    const overallStarRating = document.getElementById('overallStarRating');
    const productRatingValue = document.getElementById('productRatingValue');
    const overallRatingValue = document.getElementById('overallRatingValue');
    const searchName = document.getElementById('searchName');
    const filterType = document.getElementById('filterType');
    const filterRating = document.getElementById('filterRating');
    
    let selected_product_rating = 0;
    let selected_overall_rating = 0;
    
    function show_toast(message, type = 'success') {
      toast.textContent = message;
      toast.className = `toast toast-${type} active`;
      
      setTimeout(() => {
        toast.classList.remove('active');
      }, 3000);
    }
    
    function update_current_time() {
      const now = new Date();
      const time_string = now.toLocaleString();
      document.getElementById('currentTime').textContent = time_string;
    }
    
    setInterval(update_current_time, 1000);
    update_current_time();
    
    function get_star_class(rating) {
      return `star-${rating}`;
    }
    
    function render_star_rating(rating) {
      let stars_html = '';
      for (let i = 1; i <= 5; i++) {
        if (i <= rating) {
          stars_html += `<span class="star ${get_star_class(i)}">★</span>`;
        } else {
          stars_html += `<span class="star star-empty">★</span>`;
        }
      }
      return stars_html;
    }
    
    function handle_star_click(rating, container, value_input, selected_var) {
      const stars = container.querySelectorAll('.star');
      stars.forEach((star, index) => {
        star.classList.remove('star-empty', 'star-1', 'star-2', 'star-3', 'star-4', 'star-5');
        if (index < rating) {
          star.classList.add(`star-${index + 1}`);
        } else {
          star.classList.add('star-empty');
        }
      });
      value_input.value = rating;
      if (selected_var === 'product') {
        selected_product_rating = rating;
      } else {
        selected_overall_rating = rating;
      }
    }
    
    productStarRating.querySelectorAll('.star').forEach(star => {
      star.addEventListener('click', () => {
        const rating = parseInt(star.dataset.rating);
        handle_star_click(rating, productStarRating, productRatingValue, 'product');
      });
    });
    
    overallStarRating.querySelectorAll('.star').forEach(star => {
      star.addEventListener('click', () => {
        const rating = parseInt(star.dataset.rating);
        handle_star_click(rating, overallStarRating, overallRatingValue, 'overall');
      });
    });
    
    async function load_suppliers() {
      await data_manager_instance.init();
      let suppliers = data_manager_instance.get_suppliers();
      
      const search_term = searchName.value.toLowerCase();
      const type_filter = filterType.value;
      const rating_filter = parseInt(filterRating.value) || 0;
      
      suppliers = suppliers.filter(supplier => {
        const matches_search = !search_term || supplier.name.toLowerCase().includes(search_term);
        const matches_type = !type_filter || supplier.type === type_filter;
        const matches_rating = supplier.overall_rating >= rating_filter;
        return matches_search && matches_type && matches_rating;
      });
      
      if (suppliers.length === 0) {
        suppliersBody.innerHTML = '<tr><td colspan="7" style="text-align: center; color: var(--text-muted);">No suppliers listed</td></tr>';
        return;
      }
      
      suppliersBody.innerHTML = suppliers.map(supplier => `
        <tr>
          <td>${supplier.name}</td>
          <td><span class="badge badge-${supplier.type}">${supplier.type.charAt(0).toUpperCase() + supplier.type.slice(1)}</span></td>
          <td>${supplier.quantities_prices || '-'}</td>
          <td>${render_star_rating(supplier.product_rating)}</td>
          <td>${render_star_rating(supplier.overall_rating)}</td>
          <td>${supplier.comments || '-'}</td>
          <td>
            <button class="btn-secondary" onclick="delete_supplier('${supplier.id}')" style="padding: 0.25rem 0.75rem; font-size: 0.75rem;">Delete</button>
          </td>
        </tr>
      `).join('');
    }
    
    async function delete_supplier(supplier_id) {
      if (confirm('Are you sure you want to delete this supplier?')) {
        data_manager_instance.delete_supplier(supplier_id);
        show_toast('Supplier deleted successfully');
        await load_suppliers();
      }
    }
    
    addSupplierBtn.addEventListener('click', () => {
      addSupplierModal.classList.add('active');
    });
    
    cancelSupplierBtn.addEventListener('click', () => {
      addSupplierModal.classList.remove('active');
      addSupplierForm.reset();
      selected_product_rating = 0;
      selected_overall_rating = 0;
      productStarRating.querySelectorAll('.star').forEach(star => {
        star.classList.remove('star-1', 'star-2', 'star-3', 'star-4', 'star-5');
        star.classList.add('star-empty');
      });
      overallStarRating.querySelectorAll('.star').forEach(star => {
        star.classList.remove('star-1', 'star-2', 'star-3', 'star-4', 'star-5');
        star.classList.add('star-empty');
      });
    });
    
    addSupplierForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const supplier = {
        name: document.getElementById('supplierName').value,
        type: document.getElementById('supplierType').value,
        quantities_prices: document.getElementById('quantitiesPrices').value,
        product_rating: selected_product_rating,
        overall_rating: selected_overall_rating,
        comments: document.getElementById('comments').value
      };
      
      if (supplier.product_rating === 0) {
        show_toast('Please select a product quality rating', 'error');
        return;
      }
      
      if (supplier.overall_rating === 0) {
        show_toast('Please select an overall rating', 'error');
        return;
      }
      
      data_manager_instance.add_supplier(supplier);
      show_toast('Supplier added successfully');
      
      addSupplierModal.classList.remove('active');
      addSupplierForm.reset();
      selected_product_rating = 0;
      selected_overall_rating = 0;
      productStarRating.querySelectorAll('.star').forEach(star => {
        star.classList.remove('star-1', 'star-2', 'star-3', 'star-4', 'star-5');
        star.classList.add('star-empty');
      });
      overallStarRating.querySelectorAll('.star').forEach(star => {
        star.classList.remove('star-1', 'star-2', 'star-3', 'star-4', 'star-5');
        star.classList.add('star-empty');
      });
      
      await load_suppliers();
    });
    
    searchName.addEventListener('input', load_suppliers);
    filterType.addEventListener('change', load_suppliers);
    filterRating.addEventListener('change', load_suppliers);
    
    async function load_user_info() {
      await auth.init();
      
      if (!auth.is_authenticated()) {
        window.location.href = 'sign-in.html';
        return;
      }
      
      const user = auth.get_current_user();
      userName.textContent = user.username;
      userRole.textContent = user.role;
      userAvatar.textContent = user.username.charAt(0).toUpperCase();
      
      await load_suppliers();
    }
    
    logoutBtn.addEventListener('click', () => {
      auth.logout();
    });
    
    load_user_info();
  </script>
</body>
</html>
