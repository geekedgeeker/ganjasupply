<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="GanjaSupply - Premium Supply Management">
  <title>Users - GanjaSupply</title>
  <link rel="stylesheet" href="../assets/css/main.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo-container">
          <img src="../assets/weedlogo.gif" alt="GanjaSupply" class="logo-image">
          <div class="logo">GanjaSupply</div>
        </div>
        <div class="logo-subtitle">Supply Management</div>
      </div>
      
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-link">
          <span>Dashboard</span>
        </a>
        <a href="inventory.html" class="nav-link">
          <span>Inventory</span>
        </a>
        <a href="orders.html" class="nav-link">
          <span>Orders</span>
        </a>
        <a href="suppliers.html" class="nav-link">
          <span>Suppliers</span>
        </a>
        <a href="users.html" class="nav-link active">
          <span>Users</span>
        </a>
        <a href="settings.html" class="nav-link">
          <span>Settings</span>
        </a>
      </nav>
      
      <div class="sidebar-footer">
        <div class="user-profile">
          <div class="user-avatar" id="userAvatar">G</div>
          <div class="user-info">
            <div class="user-name" id="userName">Loading...</div>
            <div class="user-role" id="userRole">Loading...</div>
          </div>
        </div>
        <button class="nav-link" id="logoutBtn" style="margin-top: 1rem; width: 100%;">
          <span>Sign Out</span>
        </button>
      </div>
    </aside>
    
    <main class="main-content">
      <header class="header">
        <div>
          <h1 class="page-title">Users</h1>
          <p class="page-subtitle">Owner login history</p>
        </div>
        <div class="header-actions">
          <div class="current-time" id="currentTime"></div>
        </div>
      </header>
      
      <div class="glass-panel" style="padding: 2rem;">
        <div class="table-container">
          <table class="data-table">
            <thead>
              <tr>
                <th>Username</th>
                <th>Role</th>
                <th>Last Login</th>
              </tr>
            </thead>
            <tbody id="usersBody">
              <tr>
                <td colspan="3" style="text-align: center; color: var(--text-muted);">Loading...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
  
  <div class="toast" id="toast"></div>
  
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/data_manager.js"></script>
  <script>
    const userAvatar = document.getElementById('userAvatar');
    const userName = document.getElementById('userName');
    const userRole = document.getElementById('userRole');
    const logoutBtn = document.getElementById('logoutBtn');
    const toast = document.getElementById('toast');
    const usersBody = document.getElementById('usersBody');
    
    function show_toast(message, type = 'success') {
      toast.textContent = message;
      toast.className = `toast toast-${type} active`;
      
      setTimeout(() => {
        toast.classList.remove('active');
      }, 3000);
    }
    
    function format_date(date_string) {
      if (!date_string) return 'Never';
      const date = new Date(date_string);
      return date.toLocaleString();
    }
    
    function update_current_time() {
      const now = new Date();
      const time_string = now.toLocaleString();
      document.getElementById('currentTime').textContent = time_string;
    }
    
    setInterval(update_current_time, 1000);
    update_current_time();
    
    async function load_users() {
      await auth.init();
      await data_manager_instance.init();
      
      const user_database = auth.user_database;
      const login_history = data_manager_instance.get_login_history();
      
      if (!user_database || !user_database.users) {
        usersBody.innerHTML = '<tr><td colspan="3" style="text-align: center; color: var(--text-muted);">No users found</td></tr>';
        return;
      }
      
      const owner_users = user_database.users.filter(user => user.role === 'owner');
      
      if (owner_users.length === 0) {
        usersBody.innerHTML = '<tr><td colspan="3" style="text-align: center; color: var(--text-muted);">No owner accounts found</td></tr>';
        return;
      }
      
      usersBody.innerHTML = owner_users.map(user => {
        const user_logins = login_history.filter(login => login.username === user.username);
        const last_login = user_logins.length > 0 
          ? user_logins.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp))[0].timestamp 
          : null;
        
        return `
          <tr>
            <td>${user.username}</td>
            <td><span class="badge badge-${user.role}">${user.role}</span></td>
            <td>${format_date(last_login)}</td>
          </tr>
        `;
      }).join('');
    }
    
    async function load_user_info() {
      await auth.init();
      
      if (!auth.is_authenticated()) {
        window.location.href = 'sign-in.html';
        return;
      }
      
      const user = auth.get_current_user();
      userName.textContent = user.username;
      userRole.textContent = user.role;
      userAvatar.textContent = user.username.charAt(0).toUpperCase();
      
      await load_users();
    }
    
    logoutBtn.addEventListener('click', () => {
      auth.logout();
    });
    
    load_user_info();
  </script>
</body>
</html>
